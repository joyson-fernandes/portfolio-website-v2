name: Promote to Production

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to promote (the short SHA from a dev deploy)"
        required: true
        type: string

env:
  IMAGE_NAME: ghcr.io/joyson-fernandes/portfolio-website

jobs:
  promote:
    runs-on: portfolio-k8s

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Verify tag exists in GHCR
        run: |
          TAG="$(echo '${{ inputs.tag }}' | xargs)"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

          # GHCR's registry API needs a token from its own token endpoint,
          # not a raw GITHUB_TOKEN bearer — works anonymously for public packages.
          TOKEN=$(curl -sSf "https://ghcr.io/token?scope=repository:joyson-fernandes/portfolio-website:pull" | grep -o '"token":"[^"]*"' | cut -d'"' -f4)

          curl -sSf -o /dev/null \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.oci.image.manifest.v1+json,application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.v2+json,application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://ghcr.io/v2/joyson-fernandes/portfolio-website/manifests/$TAG" \
            || (echo "::error::Tag '$TAG' not found in $IMAGE_NAME" && exit 1)

      - name: Update ArgoCD repository (production)
        env:
          ARGOCD_TOKEN: ${{ secrets.ARGOCD_REPO_TOKEN }}
        run: |
          git clone \
            https://x-access-token:${ARGOCD_TOKEN}@github.com/joyson-fernandes/ArgoCD.git \
            argocd-repo

          cd argocd-repo

          echo "Promoting production image to:"
          echo "$IMAGE_NAME:$TAG"

          sed -i \
            "s|image: ghcr.io/joyson-fernandes/portfolio-website:.*|image: ghcr.io/joyson-fernandes/portfolio-website:${TAG}|" \
            manifests/portfolio/portfolio.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add manifests/portfolio/portfolio.yaml

          if git diff --cached --quiet; then
            echo "No image change"
            exit 0
          fi

          git commit -m "deploy: promote portfolio $TAG to production [skip ci]"
          git push origin main

      - name: Trigger immediate ArgoCD sync (production)
        run: |
          curl -fsSL "https://dl.k8s.io/release/$(curl -Ls https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" -o /tmp/kubectl
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          kubectl -n argocd annotate application portfolio argocd.argoproj.io/refresh=normal --overwrite

      - name: Configure AWS credentials (OIDC)
        id: aws
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::566256065001:role/github-portfolio-ecr-push
          aws-region: eu-west-2

      - name: Sync DR image to ECR
        if: steps.aws.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          REGISTRY=566256065001.dkr.ecr.eu-west-2.amazonaws.com
          ECR=$REGISTRY/portfolio

          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip

          curl -sSfL https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o /tmp/awscliv2.zip
          unzip -q -o /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install --update

          curl -sSfL https://github.com/google/go-containerregistry/releases/download/v0.20.3/go-containerregistry_Linux_x86_64.tar.gz \
            | sudo tar -xz -C /usr/local/bin crane

          aws ecr get-login-password --region eu-west-2 \
            | crane auth login "$REGISTRY" -u AWS --password-stdin

          crane copy "$IMAGE_NAME:$TAG" "$ECR:$TAG"
          crane copy "$IMAGE_NAME:$TAG" "$ECR:latest"

          echo "**DR image:** \`$ECR:$TAG\` (also \`latest\`)" >> "$GITHUB_STEP_SUMMARY"    

      - name: Summary
        run: |
          echo "## 🚀 Promoted to Production" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image:** \`$IMAGE_NAME:$TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Live:** https://joysonfernandes.com" >> "$GITHUB_STEP_SUMMARY"
