name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/joyson-fernandes/portfolio-website

jobs:

  # ---------------------------------------------------------
  # Pull Request
  # Build + Scan only
  # ---------------------------------------------------------
  preview:
    runs-on: self-hosted
    if: github.event_name == 'pull_request'

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build PR image
        run: |
          TAG="pr-${{ github.event.number }}"

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag $IMAGE_NAME:$TAG \
            --push \
            ./app

      - name: Scan image
        run: |
          if command -v trivy >/dev/null 2>&1; then
            trivy image \
              --severity CRITICAL,HIGH \
              --no-progress \
              $IMAGE_NAME:pr-${{ github.event.number }}
          else
            echo "Trivy not installed - skipping scan"
          fi

  # ---------------------------------------------------------
  # Production
  # Build → GHCR → Update ArgoCD repo
  # ---------------------------------------------------------
  build-and-publish:
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          TAG=$(git rev-parse --short HEAD)

          echo "Building:"
          echo "$IMAGE_NAME:$TAG"

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag $IMAGE_NAME:$TAG \
            --push \
            ./app

          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Scan image
        run: |
          if command -v trivy >/dev/null 2>&1; then
            trivy image \
              --severity CRITICAL,HIGH \
              --no-progress \
              $IMAGE_NAME:$IMAGE_TAG
          else
            echo "Trivy not installed - skipping scan"
          fi

      - name: Update ArgoCD repository
        env:
          ARGOCD_TOKEN: ${{ secrets.ARGOCD_REPO_TOKEN }}
        run: |

          git clone \
            https://x-access-token:${ARGOCD_TOKEN}@github.com/joyson-fernandes/ArgoCD.git \
            argocd-repo

          cd argocd-repo

          echo "Updating image to:"
          echo "$IMAGE_NAME:$IMAGE_TAG"

          sed -i \
            "s|image: ghcr.io/joyson-fernandes/portfolio-website:.*|image: ghcr.io/joyson-fernandes/portfolio-website:${IMAGE_TAG}|" \
            manifests/portfolio/deployment.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add manifests/portfolio/deployment.yaml

          if git diff --cached --quiet; then
            echo "No image change"
            exit 0
          fi

          git commit \
            -m "deploy: portfolio ${IMAGE_TAG}"

          git push origin main

      - name: Summary
        run: |
          echo "## 🚀 Portfolio Image Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image:** \`$IMAGE_NAME:$IMAGE_TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Platforms:** linux/amd64, linux/arm64" >> "$GITHUB_STEP_SUMMARY"
