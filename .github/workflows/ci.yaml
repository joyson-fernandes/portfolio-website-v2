name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE: ghcr.io/joyson-fernandes/portfolio-website
  BUILDKIT_HOST: tcp://buildkitd.arc-runners.svc.cluster.local:1234
  BUILDKIT_VERSION: v0.17.1

jobs:
  # Preview: runs on PRs — builds image and deploys it to a per-PR namespace
  preview:
    runs-on: portfolio-k8s
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    permissions:
      contents: read
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Install buildctl
        run: |
          curl -sSL "https://github.com/moby/buildkit/releases/download/${BUILDKIT_VERSION}/buildkit-${BUILDKIT_VERSION}.linux-amd64.tar.gz" \
            | tar -xz -C /tmp
          sudo mv /tmp/bin/buildctl /usr/local/bin/buildctl

      - name: Log in to GHCR (registry auth for buildctl)
        run: |
          mkdir -p ~/.docker
          AUTH=$(echo -n "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" | base64 -w0)
          echo "{\"auths\":{\"ghcr.io\":{\"auth\":\"$AUTH\"}}}" > ~/.docker/config.json

      - name: Build and push preview image
        run: |
          TAG="pr-${{ github.event.number }}"
          buildctl build \
            --frontend dockerfile.v0 \
            --local context=./app \
            --local dockerfile=./app \
            --output type=image,name=$IMAGE:$TAG,push=true

      - name: Scan image with Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy image --image-src remote --exit-code 1 --severity CRITICAL,HIGH --no-progress $IMAGE:pr-${{ github.event.number }}

      - name: Deploy preview to K8s
        run: |
          NS="portfolio-preview-${{ github.event.number }}"
          TAG="pr-${{ github.event.number }}"
          PORT=$((30000 + (${{ github.event.number }} % 2700)))
          NODE_IP=$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[0].address}')

          kubectl create namespace $NS --dry-run=client -o yaml | kubectl apply -f -

          cat <<EOF | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: portfolio-preview
            namespace: $NS
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: portfolio-preview
            template:
              metadata:
                labels:
                  app: portfolio-preview
              spec:
                containers:
                - name: portfolio-app
                  image: $IMAGE:$TAG
                  ports:
                  - containerPort: 3000
                  env:
                  - name: PORT
                    value: "3000"
                  - name: NODE_ENV
                    value: "production"
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: portfolio-preview
            namespace: $NS
          spec:
            type: NodePort
            selector:
              app: portfolio-preview
            ports:
            - port: 3000
              targetPort: 3000
              nodePort: $PORT
          EOF

          kubectl rollout status deployment/portfolio-preview -n $NS --timeout=120s

          echo "## 🔍 Preview Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Preview is running at: **http://${NODE_IP}:${PORT}**" >> $GITHUB_STEP_SUMMARY
          echo "PREVIEW_URL=http://${NODE_IP}:${PORT}" >> $GITHUB_ENV

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const body = `### 🔍 Preview Deployed\n\nPreview is running at: **${{ env.PREVIEW_URL }}**\n\n_Updated at ${new Date().toISOString()}_`;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event.number }},
            });
            const existing = comments.data.find(c => c.body.includes('Preview Deployed'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: ${{ github.event.number }},
                body,
              });
            }

  # Cleanup: runs when PR is merged or closed
  preview-cleanup:
    runs-on: portfolio-k8s
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    steps:
      - name: Delete preview namespace
        run: |
          kubectl delete namespace portfolio-preview-${{ github.event.number }} --ignore-not-found

  # Production: runs on push to main
  build-and-deploy:
    runs-on: portfolio-k8s
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Install buildctl
        run: |
          curl -sSL "https://github.com/moby/buildkit/releases/download/${BUILDKIT_VERSION}/buildkit-${BUILDKIT_VERSION}.linux-amd64.tar.gz" \
            | tar -xz -C /tmp
          sudo mv /tmp/bin/buildctl /usr/local/bin/buildctl

      - name: Log in to GHCR (registry auth for buildctl)
        run: |
          mkdir -p ~/.docker
          AUTH=$(echo -n "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" | base64 -w0)
          echo "{\"auths\":{\"ghcr.io\":{\"auth\":\"$AUTH\"}}}" > ~/.docker/config.json

      - name: Build and push
        run: |
          TAG=$(git rev-parse --short HEAD)
          buildctl build \
            --frontend dockerfile.v0 \
            --local context=./app \
            --local dockerfile=./app \
            --output type=image,name=$IMAGE:$TAG,name=$IMAGE:latest,push=true
          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV

      - name: Scan image with Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy image --image-src remote --exit-code 1 --severity CRITICAL,HIGH --no-progress $IMAGE:$IMAGE_TAG

      - name: Checkout ArgoCD repo
        uses: actions/checkout@v4
        with:
          repository: joyson-fernandes/ArgoCD
          token: ${{ secrets.ARGOCD_REPO_TOKEN }}
          path: argocd-repo

      - name: Update image tag in ArgoCD manifest
        run: |
          sed -i "s|image: ghcr.io/joyson-fernandes/portfolio-website:.*|image: ghcr.io/joyson-fernandes/portfolio-website:$IMAGE_TAG|" argocd-repo/manifests/portfolio/portfolio.yaml

      - name: Commit and push updated image tag
        working-directory: argocd-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifests/portfolio/portfolio.yaml
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "deploy: update portfolio image to $IMAGE_TAG [skip ci]"
          git push
