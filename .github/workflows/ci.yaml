name: CI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/ci.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/ci.yaml'

env:
  IMAGE_NAME: ghcr.io/joyson-fernandes/portfolio-website

jobs:

  # ---------------------------------------------------------
  # Pull Request
  # Build + Scan only
  # ---------------------------------------------------------
  preview:
    runs-on: portfolio-k8s
    if: github.event_name == 'pull_request'

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Docker CLI + buildx plugin
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg
          sudo install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y docker-ce-cli docker-buildx-plugin

      - name: Create Kubernetes buildx builder
        run: |
          docker buildx create --driver kubernetes --driver-opt namespace=arc-runners,rootless=true --name k8s-builder --use
          docker buildx inspect --bootstrap

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build PR image
        run: |
          TAG="pr-${{ github.event.number }}"

          docker buildx build \
            --platform linux/amd64 \
            --tag $IMAGE_NAME:$TAG \
            --push \
            ./app

      - name: Scan image
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
          trivy image --image-src remote --exit-code 1 --severity CRITICAL,HIGH --no-progress $IMAGE_NAME:pr-${{ github.event.number }}

  # ---------------------------------------------------------
  # Dev
  # Build → GHCR → deploy to portfolio-dev (dev.joysonfernandes.com)
  # Promotion to production is manual — see promote-prod.yaml
  # ---------------------------------------------------------
  build-and-publish:
    runs-on: portfolio-k8s
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Docker CLI + buildx plugin
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg
          sudo install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y docker-ce-cli docker-buildx-plugin

      - name: Create Kubernetes buildx builder
        run: |
          docker buildx create --driver kubernetes --driver-opt namespace=arc-runners,rootless=true --name k8s-builder --use
          docker buildx inspect --bootstrap

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          TAG=$(git rev-parse --short HEAD)

          echo "Building:"
          echo "$IMAGE_NAME:$TAG"

          docker buildx build \
            --platform linux/amd64 \
            --tag $IMAGE_NAME:$TAG \
            --tag $IMAGE_NAME:latest \
            --push \
            ./app

          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Scan image
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
          trivy image --image-src remote --exit-code 1 --severity CRITICAL,HIGH --no-progress $IMAGE_NAME:$IMAGE_TAG

      - name: Update ArgoCD repository (dev)
        env:
          ARGOCD_TOKEN: ${{ secrets.ARGOCD_REPO_TOKEN }}
        run: |
          git clone \
            https://x-access-token:${ARGOCD_TOKEN}@github.com/joyson-fernandes/ArgoCD.git \
            argocd-repo

          cd argocd-repo

          echo "Updating dev image to:"
          echo "$IMAGE_NAME:$IMAGE_TAG"

          sed -i \
            "s|image: ghcr.io/joyson-fernandes/portfolio-website:.*|image: ghcr.io/joyson-fernandes/portfolio-website:${IMAGE_TAG}|" \
            manifests/portfolio-dev/portfolio-dev.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add manifests/portfolio-dev/portfolio-dev.yaml

          if git diff --cached --quiet; then
            echo "No image change"
            exit 0
          fi

          git commit -m "deploy: portfolio-dev $IMAGE_TAG [skip ci]"
          git push origin main

      - name: Trigger immediate ArgoCD sync (dev)
        run: |
          curl -fsSL "https://dl.k8s.io/release/$(curl -Ls https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" -o /tmp/kubectl
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          kubectl -n argocd annotate application portfolio-dev argocd.argoproj.io/refresh=normal --overwrite

      - name: Summary
        run: |
          echo "## 🚀 Portfolio Image Published to Dev" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image:** \`$IMAGE_NAME:$IMAGE_TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Dev:** https://dev.joysonfernandes.com" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Once verified, promote to production via the **Promote to Production** workflow (Actions tab → Run workflow), passing \`$IMAGE_TAG\`." >> "$GITHUB_STEP_SUMMARY"
